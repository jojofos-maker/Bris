<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meny | Bris</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    height:100%;
    overflow:hidden;
    background:#f8f3ea;
    font-family:Georgia, serif;
    color:#15375c;
}

header{
    height:70px;
    padding:0 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fffaf2;
    border-bottom:1px solid #ece5d8;
}

.logo{
    font-size:42px;
    text-decoration:none;
    color:#15375c;
}

nav a{
    margin-left:24px;
    text-decoration:none;
    color:#15375c;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
}

main{
    height:calc(100vh - 70px);
    padding:15px;
}

.menu-image{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.menu-image img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

@media (max-width:700px){

    header{
        height:90px;
        flex-direction:column;
        justify-content:center;
        gap:8px;
    }

    .logo{
        font-size:34px;
    }

    nav a{
        margin:0 8px;
        font-size:12px;
    }

    main{
        height:calc(100vh - 90px);
        padding:10px;
    }
}

</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">Bris</a>

    <nav>
        <a href="index.html">Hjem</a>
        <a href="meny.html">Meny</a>
        <a href="om.html">Om oss</a>
    </nav>
</header>

<main>
    <div class="menu-image">
        <img src="assets/meny.png" alt="Meny for Bris">
    </div>
</main>

</body>
</html>
