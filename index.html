<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bris – Restaurant i Lillesand</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f8f3ea;
      color: #15375c;
    }

    body {
      font-family: Georgia, serif;
    }

    .site-header {
      height: 70px;
      padding: 0 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fffaf2;
    }

    .logo {
      font-size: 42px;
      text-decoration: none;
      color: #15375c;
    }

    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #15375c;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      height: calc(100vh - 70px);
    }

    .hero {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

.hero img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  background: #f8f3ea;
}

    @media (max-width: 700px) {
      .site-header {
        height: 90px;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
      }

      main {
        height: calc(100vh - 90px);
      }

      nav a {
        margin: 0 8px;
        font-size: 12px;
      }

      .logo {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a href="index.html" class="logo">Bris</a>

    <nav aria-label="Hovedmeny">
      <a href="index.html">Hjem</a>
      <a href="meny.html">Meny</a>
      <a href="om.html">Om oss</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Bris forsidebilde med sommer, hav og mat">
      <img src="assets/bris-forside.png" alt="Bris – sommerlig mat ved kysten i Lillesand">
    </section>
  </main>
</body>
</html>
